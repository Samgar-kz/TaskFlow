name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore TaskFlow.slnx
      - name: Build
        run: dotnet build TaskFlow.slnx -c Release --no-restore
      - name: Test (unit + integration with Testcontainers PostgreSQL)
        run: dotnet test TaskFlow.slnx -c Release --no-build --logger "trx" --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-results
          path: backend/TestResults

  frontend:
    name: Frontend (Vue 3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint:ci
      - name: Type-check
        run: npm run type-check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build-only

  docker:
    name: Docker images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: docker compose build
