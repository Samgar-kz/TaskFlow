# Local demo stack: PostgreSQL + Redis (SignalR backplane) + API + web UI.
#   docker compose up --build
#   UI:  http://localhost:8082   (demo@taskflow.dev / Demo123!)
#   API: http://localhost:5100/scalar
name: taskflow

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Database: Host=db;Port=5432;Database=taskflow;Username=taskflow;Password=taskflow;GSS Encryption Mode=Disable
      # With Redis configured, SignalR messages are shared across API instances (scale-out ready).
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-demo-signing-key-change-me-0123456789}
      Database__MigrateOnStartup: "true"
      OpenApi__Enabled: "true"
      # Demo team for local evaluation only. Never enable seeding in a real deployment.
      Seed__Enabled: "true"
      Seed__DemoPassword: Demo123!
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5100:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8082:80"

volumes:
  pgdata:
